<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curva de aprendizado — Códice JS</title>
    <meta
      name="description"
      content="Curva de aprendizado do Códice JS: visualize o percurso do iniciante à conclusão, XP, liga e cobertura de aulas."
    />
    <link rel="canonical" href="http://127.0.0.1:4173/pages/evolucao.html" />
    <meta property="og:title" content="Curva de aprendizado — Códice JS" />
    <meta property="og:description" content="Interface de evolução no conteúdo de JavaScript." />
    <meta name="theme-color" content="#07070b" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header class="site-header" data-header></header>
    <div class="status-bar" data-status-bar role="region" aria-label="Variáveis da sessão"></div>
    <main id="conteudo" class="wrap">
      <header class="page-hero">
        <p class="kicker">Evolução no conteúdo</p>
        <h1>A curva, não a reta.</h1>
        <p class="lede">
          Cada nó é uma aula. O traço em degradê avança conforme você conclui vídeos e atividades.
          Clique num ponto para abrir a sala correspondente.
        </p>
      </header>
      <figure class="curve-wrap">
        <div data-curve></div>
        <figcaption class="legend">Legenda: ouro inicia · âmbar aprofunda · jade conclui.</figcaption>
      </figure>
      <section class="section">
        <div class="grid-4" data-evo-stats></div>
      </section>
      <section class="section">
        <div class="section-head">
          <div>
            <p class="eyebrow">Cobertura por estação</p>
            <h2>Onde a curva ainda é rasa</h2>
          </div>
        </div>
        <div class="grid-4" data-tracks-legend></div>
      </section>
    </main>
    <footer class="site-footer" data-footer></footer>
    <script type="module" src="/js/pages/evolucao.js"></script>
  </body>
</html>
