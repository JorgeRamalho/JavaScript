<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sala de aula — Códice JS</title>
    <meta
      name="description"
      content="Sala de aula do Códice JS com o curso JavaScript do Prof. Gustavo Guanabara (Curso em Vídeo), do iniciante à conclusão."
    />
    <link rel="canonical" href="http://127.0.0.1:4173/pages/sala.html" />
    <meta property="og:title" content="Sala de aula — Códice JS" />
    <meta property="og:description" content="Vídeos, notas e conclusão de aulas da trilha JavaScript." />
    <meta name="theme-color" content="#07070b" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header class="site-header" data-header></header>
    <div class="status-bar" data-status-bar role="region" aria-label="Variáveis da sessão"></div>
    <main id="conteudo" class="wrap">
      <section class="classroom">
        <div class="classroom-stage">
          <header class="lesson-head">
            <div>
              <p class="kicker" data-lesson-kicker>Iniciante</p>
              <h1 data-lesson-title>Aula</h1>
              <p class="legend" data-lesson-meta></p>
            </div>
            <div class="lesson-nav">
              <button class="btn btn-ghost" type="button" data-prev>Aula anterior</button>
              <button class="btn btn-sky" type="button" data-next>Próxima aula</button>
            </div>
          </header>
          <div class="player-frame" data-player></div>
          <article class="lesson-notes">
            <p class="caption">Notas da aula</p>
            <p data-lesson-summary></p>
            <p data-lesson-notes></p>
            <button class="btn btn-gold" type="button" data-complete>Marcar como concluída</button>
          </article>
        </div>
        <aside class="playlist">
          <p class="caption">Playlist</p>
          <h2>Do iniciante à conclusão</h2>
          <p class="legend">
            <a href="https://www.youtube.com/playlist?list=PLHz_AreHm4dlsK3Nr9GVvXCbpQyHQl1o1" target="_blank" rel="noopener noreferrer">Curso em Vídeo — Gustavo Guanabara</a>
          </p>
          <nav class="playlist-list" data-syllabus aria-label="Playlist do curso"></nav>
        </aside>
      </section>
    </main>
    <footer class="site-footer" data-footer></footer>
    <script type="module" src="/js/pages/sala.js"></script>
  </body>
</html>
